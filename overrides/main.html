{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.meta and page.meta.course_color %}
    <style>
      :root {
        --course-header-color: {{ page.meta.course_color | e }};
        --course-page-accent: {{ page.meta.course_color | e }};
        {% if page.meta.course_color_dark %}
        --course-page-accent-dark: {{ page.meta.course_color_dark | e }};
        {% endif %}
        --md-primary-bg-color: #fff;
      }
    </style>
  {% endif %}
{% endblock %}
