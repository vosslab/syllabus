site_name: Dr. Voss Course Syllabi
site_description: Accessible course syllabi for classes taught by Dr. Neil R. Voss.
site_url: https://vosslab.github.io/syllabus/
docs_dir: site_docs
site_dir: site
exclude_docs: |
  */shared/fragments/*
  generated/*
hooks:
  - pipeline/mkdocs_hooks.py

theme:
  name: material
  custom_dir: overrides
  favicon: assets/images/favicon.svg
  logo: assets/images/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.footer
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow

plugins:
  - search
  - meta

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pipeline.build_lib.table_layouts
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/site.css

extra_javascript:
  - assets/javascripts/accessibility.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vosslab
      name: GitHub
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/neilvosslab
      name: YouTube
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/neilvosslab.bsky.social
      name: Bluesky
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vosslab
      name: LinkedIn
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/neilvosslab
      name: Facebook
copyright: Copyright &copy; 2026 Neil R. Voss. Course materials are licensed CC BY 4.0.

