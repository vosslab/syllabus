site_name: Dr. Voss Course Syllabi
site_description: Accessible course syllabi for classes taught by Dr. Neil R. Voss.
site_url: https://vosslab.github.io/syllabus/
docs_dir: site_docs
site_dir: site
exclude_docs: |
  */shared/*

theme:
  name: material
  custom_dir: overrides
  font: false
  features:
    - content.footer
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow

plugins:
  - search
  - meta

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path:
        - site_docs
      check_paths: true
      restrict_base_path: true
      url_download: false

extra_css:
  - assets/stylesheets/site.css

extra_javascript:
  - assets/javascripts/accessibility.js

copyright: Copyright &copy; 2026 Neil R. Voss. Course materials are licensed CC BY 4.0.

nav:
  - Home: index.md
  - Fall 2026:
