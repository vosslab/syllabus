name: Build and deploy syllabus site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pip_requirements.txt

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libharfbuzz-subset0 \
            libharfbuzz0b \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            pandoc \
            poppler-utils

      - name: Install Python dependencies
        run: python3 -m pip install -r pip_requirements.txt

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build the publication artifact
        run: python3 pipeline/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
